ktor:
  application:
    modules:
      - com.japp.ApplicationKt.module
  deployment:
    port: 8080

jwt:
  secret: ${JWT_SECRET:lDK6GTJ5kxi6bvRGGfoe5g8TPZx9HhrQ3SsyWF+hyZs}
  issuer: ${JWT_ISSUER:japp-issuer}
  audience: ${JWT_AUDIENCE:japp-audience}
  realm: "Japp API"
  expirationDays: ${JWT_EXPIRATION_DAYS:7}

database:
  url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/japp}
  driver: ${DATABASE_DRIVER:org.postgresql.Driver}
  user: ${DATABASE_USER:japp}
  password: ${DATABASE_PASSWORD:japper}
  pool:
    maximumPoolSize: ${DB_POOL_MAX_SIZE:10}
    minimumIdle: ${DB_POOL_MIN_IDLE:2}
    connectionTimeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
    idleTimeout: ${DB_POOL_IDLE_TIMEOUT:600000}
    maxLifetime: ${DB_POOL_MAX_LIFETIME:1800000}

websocket:
  heartbeatIntervalInSeconds: 20

storage:
  attachments:
    basePath: ${STORAGE_ATTACHMENTS_PATH:/var/japp/attachments}
  profilePictures:
    basePath: ${STORAGE_PROFILE_PICTURES_PATH:/var/japp/profile-pictures}

app:
  version: 1.0.0
  environment: ${APP_ENV:development}