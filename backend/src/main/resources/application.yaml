ktor:
  application:
    modules:
      - com.japp.ApplicationKt.module
  deployment:
    port: 8080

jwt:
  secret: ${JWT_SECRET:CHANGE-IN-PROD-BOZO}
  issuer: ${JWT_ISSUER:japp-issuer}
  audience: ${JWT_AUDIENCE:japp-audience}
  realm: "Japp API"
  expirationDays: 7

database:
  url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/japp}
  driver: org.postgresql.Driver
  user: ${POSTGRES_USER:japp}
  password: ${POSTGRES_PASSWORD:japper}
  pool:
    maximumPoolSize: 10
    minimumIdle: 2
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000

app:
  version: 1.0.0