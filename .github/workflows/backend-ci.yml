name: Backend CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  firebase_secret: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          # Only cache dependencies, not build outputs
          cache: 'gradle'
          cache-dependency-path: 'backend/gradle/wrapper/gradle-wrapper.properties'

      - name: Copy FIREBASE_SECRET
        env:
          firebase_secret: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo $firebase_secret > ./src/main/resources/firebase-service-account.json
        
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Clean previous builds
        run: ./gradlew clean --no-daemon
      
      - name: Build and Test
        run: ./gradlew build --no-daemon --no-build-cache

      - name: Generate Kover Coverage reports
        run: ./gradlew koverHtmlReport --no-daemon
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/build/reports/tests/test/
      
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/build/reports/kover/html/
      
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f build/reports/tests/test/index.html ]; then
            echo "Tests completed - see artifacts for details" >> $GITHUB_STEP_SUMMARY
          else
            echo "Tests failed or did not run" >> $GITHUB_STEP_SUMMARY
          fi