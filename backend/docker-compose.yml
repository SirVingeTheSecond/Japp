services:
    backend:
        build: .
        container_name: japp-app-backend
        restart: unless-stopped
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.japp-app-api.rule=Host(`japp-app-api.itnerd.net`)"
            - "traefik.http.routers.japp-app-api.entrypoints=web,websecure"
            - "traefik.http.services.japp-app-api.loadbalancer.server.port=8080"
            - "traefik.http.routers.japp-app-api.tls=true"
            - "traefik.http.routers.japp-app-api.tls.certresolver=letsencrypt"
            - "traefik.http.routers.japp-app-api.tls.domains[0].main=japp-app-api.itnerd.net"
        depends_on:
            - database
        environment:
            POSTGRES_URL: "jdbc:postgresql://10.23.45.2/japp"
            POSTGRES_USER: "japp"
            DATABASE_PASSWORD: ${DATABASE_PASSWORD}  # From .env file
            JWT_SECRET: ${JWT_SECRET}
            JWT_ISSUER: ${JWT_ISSUER:-japp-issuer}
            JWT_AUDIENCE: ${JWT_AUDIENCE:-japp-audience}
            APP_ENV: production
        volumes:
            - japp-backend-data:/var/japp
        networks:
            japp-app-backend-network:
                ipv4_address: 10.23.45.3
            private_network:
        

    database:
        image: postgres:17.4
        container_name: japp-app-database
        restart: unless-stopped
        environment:
            POSTGRES_USER: japp
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
            POSTGRES_DB: japp
        volumes:
            - japp-database-data:/var/lib/postgresql/data
        networks:
            japp-app-backend-network:
                ipv4_address: 10.23.45.2


networks:
    japp-app-backend-network:
        ipam:
            driver: default
            config:
                - subnet: "10.23.45.0/24"
    private_network:
        external: true

volumes:
    japp-backend-data:
    japp-database-data: